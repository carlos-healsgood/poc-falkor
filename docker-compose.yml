services:
  db:
    image: postgres:16
    container_name: project_db
    environment:
      POSTGRES_DB: project_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"
    volumes:
      - falkordb_data:/data

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/project_db
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: 6379
    depends_on:
      - db
      - falkordb

volumes:
  postgres_data:
  falkordb_data:
